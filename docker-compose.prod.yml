# Production Compose for Dokploy.
#
# Dokploy writes Environment-tab values to `.env` next to this file.
# Do NOT add Traefik labels, Caddy, or host port bindings — Dokploy Traefik
# attaches domains in the UI (Domains tab → service name + container port).
#
# API startup (same DATABASE_URL for all three steps):
#   PostgreSQL healthy → prisma migrate deploy → Super Admin seed → Nest
#
# Dokploy UI:
#   Compose path: docker-compose.prod.yml
#   Advanced → Isolated Deployments: ON
#   Domains (Let's Encrypt):
#     web     → PUBLIC_WEB_URL host,    port 3001
#     portal  → PUBLIC_PORTAL_URL host, port 3000
#
# Do not publish Postgres or Redis. Do not add container_name
# (Isolated Deployments suffixes resources).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - chhata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - chhata_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Single URL used by migrate, seed-cli, and the Nest process.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_DIR: /app/uploads
      CORS_ORIGIN: ${PUBLIC_PORTAL_URL},${PUBLIC_WEB_URL}
      BETTER_AUTH_URL: ${PUBLIC_PORTAL_URL}
      API_URL: ${PUBLIC_PORTAL_URL}
      PUBLIC_APP_URL: ${PUBLIC_PORTAL_URL}
      ATOM_RETURN_URL: ${PUBLIC_WEB_URL}/propertytax/payment/return
      ATOM_CALLBACK_URL: ${PUBLIC_WEB_URL}/api/v1/payments/gateway/callback
    volumes:
      - chhata_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    expose:
      - "4000"

  portal:
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_APP_URL: ${PUBLIC_PORTAL_URL}
        NEXT_PUBLIC_CITIZEN_WEB_URL: ${PUBLIC_WEB_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: ${PUBLIC_PORTAL_URL}
      NEXT_PUBLIC_CITIZEN_WEB_URL: ${PUBLIC_WEB_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    expose:
      - "3001"

volumes:
  chhata_pg_data:
  chhata_redis_data:
  chhata_uploads:
