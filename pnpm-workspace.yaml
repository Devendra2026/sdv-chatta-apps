packages:
  - "apps/*"
  - "packages/*"

catalog:
  react: 19.2.8
  react-dom: 19.2.8
  next: 16.3.4
  typescript: ^6.0.3
  eslint: ^10.9.1
  "@types/node": ^26.4.0

overrides:
  # Pin to 11.x: >=11.1.1 security fix without uuid@14 ESM (breaks Jest + exceljs)
  uuid: ^14.0.2

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  argon2: true
  esbuild: false
  msgpackr-extract: false
  msw: false
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true
