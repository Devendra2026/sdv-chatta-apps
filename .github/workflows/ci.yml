name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-change-me-32chars
      # Prisma 7 prisma.config.ts requires DATABASE_URL even for generate.
      # This value is generate-only and is never used to connect.
      DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm docker:prod:config
      - run: pnpm build

