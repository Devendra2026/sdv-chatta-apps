services:
  postgres:
    image: postgres:16-alpine
    container_name: chhata-postgres
    restart: unless-stopped
    ports:
      # Host 5432 is often taken by other local stacks (e.g. api-survey-local).
      - "5433:5432"
    environment:
      POSTGRES_USER: chhata
      POSTGRES_PASSWORD: chhata
      POSTGRES_DB: chhata
    volumes:
      - chhata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chhata -d chhata"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chhata-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - chhata_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chhata_pg_data:
  chhata_redis_data:
